[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "tc5061_proyecto_equipo_44"
version = "0.0.1"
description = "Proyecto integrador de la materia de MLOps que toma los datos de mibici para realizar un flujo de MLOps."
authors = [
  { name = "Equipo 44" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"
dependencies = [
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pyarrow",
    "seaborn>=0.13.2",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["tc5061_proyecto_equipo_44"]
force_sort_within_sections = true

