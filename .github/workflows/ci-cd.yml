name: CI - Tests and Container Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run PyTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  build-image:
    name: Build API container image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Containerfile inputs
        run: |
          test -f Containerfile
          test -f api/requirements-api.txt
          test -d api
          test -d models/serving
          if ! find models/serving -type f -print -quit | grep -q .; then
            echo "ERROR: models/serving exists but contains no model files."
            echo "The Containerfile copies models/serving into the image, so CI needs the serving artifacts."
            exit 1
          fi

      - name: Build API image
        run: docker build --file Containerfile --tag mibici-api:ci-${GITHUB_SHA} .
